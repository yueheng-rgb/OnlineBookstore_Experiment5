openapi: "3.0.3"
info:
  title: "在线书店系统 API"
  description: "实验五：软件项目开发阶段管理——在线书店系统开发 API 文档"
  version: "1.0.0"
  contact:
    name: "Experiment5 Team"
    email: "experiment5@example.com"
  license:
    name: "MIT"
    url: "https://opensource.org/licenses/MIT"

servers:
  - url: "http://localhost:8080"
    description: "本地开发服务器"

paths:
  /api/users/register:
    post:
      tags: ["用户管理"]
      summary: "用户注册"
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: "注册成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseUser"

  /api/users/login:
    post:
      tags: ["用户管理"]
      summary: "用户登录"
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: "登录成功"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseUser"

  /api/users/{id}:
    get:
      tags: ["用户管理"]
      summary: "查询用户"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "成功"
    put:
      tags: ["用户管理"]
      summary: "更新用户"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        format: int64
      responses:
        "200":
          description: "成功"
    delete:
      tags: ["用户管理"]
      summary: "删除用户"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "成功"

  /api/books:
    get:
      tags: ["图书管理"]
      summary: "图书列表"
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: "成功"
    post:
      tags: ["图书管理"]
      summary: "添加图书"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookRequest"
      responses:
        "201":
          description: "创建成功"

  /api/books/{id}:
    get:
      tags: ["图书管理"]
      summary: "查询图书"
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "成功"

  /api/carts/{userId}:
    get:
      tags: ["购物车管理"]
      summary: "查看购物车"
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: "成功"

  /api/orders:
    post:
      tags: ["订单管理"]
      summary: "创建订单"
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
      responses:
        "201":
          description: "创建成功"

components:
  schemas:
    ApiResponseUser:
      type: object
      properties:
        code:
          type: integer
          example: 200
        message:
          type: string
          example: "操作成功"
        data:
          $ref: "#/components/schemas/User"
        timestamp:
          type: string
          format: date-time

    RegisterRequest:
      type: object
      required: ["username", "password", "email"]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          minLength: 6
        email:
          type: string
          format: email
        phone:
          type: string
        address:
          type: string

    LoginRequest:
      type: object
      required: ["username", "password"]
      properties:
        username:
          type: string
        password:
          type: string

    BookRequest:
      type: object
      required: ["isbn", "title", "author", "price"]
      properties:
        isbn:
          type: string
        title:
          type: string
        author:
          type: string
        publisher:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        stock:
          type: integer
        category:
          type: string

    OrderRequest:
      type: object
      required: ["shippingAddress"]
      properties:
        shippingAddress:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        phone:
          type: string
        address:
          type: string
        role:
          type: string
          enum: ["CUSTOMER", "ADMIN"]
